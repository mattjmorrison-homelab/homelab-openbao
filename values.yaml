ui:
  enabled: true
  serviceType: ClusterIP

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: openbao.morrisons.site
        paths:
          - /
    pathType: Prefix

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

  authDelegator:
    enabled: true

  readinessProbe:
    enabled: false

  dataStorage:
    enabled: true
    size: 10Gi
